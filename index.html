<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> SGSA | Login</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

    <main class="login-container">

        
        <section class="login-banner">

    <div class="unijorge">

        <img src="img/uj-logo.png" alt="Unijorge">

    </div>

    <div class="banner-content">

        <div data-aos="fade-up" data-aos-duration="2500" class="sgsa-icon">

            <i class="fa-solid fa-book-open-reader"></i>

        </div>

        <h1 data-aos="fade-up" data-aos-duration="1500">SGSA</h1>

        <div data-aos="fade-up" data-aos-duration="1500" class="line"></div>

        <p data-aos="fade-up" data-aos-duration="1500" >
            Sistema de Gerenciamento de Sala de Aula
        </p>

    </div>

    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

</section>

        <section class="login-formulario">

            <div class="formulario-header">

                <h2>Entrar</h2>

                <p>
                    Faça login para acessar o sistema.
                </p>

            </div>

            <form>

                <div class="input-group">

                    <label for="email">
                        Usuário
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Digite seu nome de usuário">

                </div>

                <div class="input-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        placeholder="Digite sua senha">

                </div>

                <div class="opcoes">

                    <label>

                        <input type="checkbox">

                        Lembrar de mim

                    </label>

                    <a href="#">
                        Esqueci minha senha
                    </a>

                </div>

                <button type="submit">
                    Entrar
                </button>

            </form>

        </section>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
    <script>
  AOS.init();
</script>

</body>
</html>
